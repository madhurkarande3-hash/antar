/* ============================================================
   VEHICLES — simple low-poly silhouettes, lights do the work
   ============================================================ */
function vehAxis(v, dir){
  if (v.state === 'exit'){ const T = branchTan(v.bs); return { p: T.p, v: T.v }; }
  return { p: dir, v: 0 };
}

/* one extruded box: 4 base corners at h0 and h1, painted far-face first */
function drawBox(cp, cvv, T, N, off, len, hw, h0, h1, rgb, lit){
  const bp = cp + T.p * off, bv = cvv + T.v * off, hl = len / 2;
  const corner = function(sl, sw){
    return { p: bp + T.p * hl * sl + N.p * hw * sw, v: bv + T.v * hl * sl + N.v * hw * sw };
  };
  const c = [corner(1, -1), corner(1, 1), corner(-1, 1), corner(-1, -1)];
  const lo = c.map(function(q){ return proj(q.p, q.v, h0); });
  const hi = c.map(function(q){ return proj(q.p, q.v, h1); });
  const face = function(i, j, fill){
    ctx.beginPath();
    ctx.moveTo(lo[i].x, lo[i].y); ctx.lineTo(lo[j].x, lo[j].y);
    ctx.lineTo(hi[j].x, hi[j].y); ctx.lineTo(hi[i].x, hi[i].y);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  };
  /* order by depth along p so the near face lands last */
  const order = [[0, 1, 0.20], [1, 2, 0.30], [3, 0, 0.26], [2, 3, 0.24]];
  order.sort(function(a, b){
    const pa = (c[a[0]].p + c[a[1]].p) / 2, pb = (c[b[0]].p + c[b[1]].p) / 2;
    return pb - pa;
  });
  for (const f of order) face(f[0], f[1], shade(rgb, f[2] * lit));
  /* roof */
  ctx.beginPath();
  ctx.moveTo(hi[0].x, hi[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(hi[i].x, hi[i].y);
  ctx.closePath();
  ctx.fillStyle = shade(rgb, 0.40 * lit); ctx.fill();
  ctx.strokeStyle = shade(rgb, 0.62 * lit, 0.85);
  ctx.lineWidth = Math.max(0.6, 1.1 * proj(bp, bv, 0).s * 1.4);
  ctx.stroke();
}

function lamp(v, T, N, spec, h, col, rad, bright){
  const q = proj(v.p + T.p * spec[0] + N.p * spec[1],
                 v.voff + T.v * spec[0] + N.v * spec[1], h);
  ctx.globalCompositeOperation = 'lighter';
  glow(q.x, q.y, rad, col, col.replace(/[\d.]+\)$/, '0)'));
  ctx.globalCompositeOperation = 'source-over';
  return q;
}

function drawVehicle(v, dir){
  const base = proj(v.p, v.voff, 0.6);
  if (base.y < horizonY() - 4 || !onScreen(base, 260)) return;
  const s = base.s, T = vehAxis(v, dir), N = { p: -T.v, v: T.p };
  const Ty = v.T, rgb = hex2rgb(v.col);
  const crashed = v.state === 'crash';

  /* headlight pool thrown down the road */
  ctx.globalCompositeOperation = 'lighter';
  const f = 46, n1 = proj(v.p + T.p * 2 - N.p * 1.5, v.voff + T.v * 2 - N.v * 1.5, 0);
  const n2 = proj(v.p + T.p * 2 + N.p * 1.5, v.voff + T.v * 2 + N.v * 1.5, 0);
  const f1 = proj(v.p + T.p * f - N.p * 4.6, v.voff + T.v * f - N.v * 4.6, 0);
  const f2 = proj(v.p + T.p * f + N.p * 4.6, v.voff + T.v * f + N.v * 4.6, 0);
  const lg = ctx.createLinearGradient(n1.x, n1.y, f1.x, f1.y);
  const dm = crashed ? 0.05 : 0.30;
  lg.addColorStop(0, 'rgba(255,216,152,' + dm + ')');
  lg.addColorStop(0.45, 'rgba(255,200,124,' + (dm * 0.40).toFixed(3) + ')');
  lg.addColorStop(1, 'rgba(255,188,98,0)');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.moveTo(n1.x, n1.y); ctx.lineTo(f1.x, f1.y);
  ctx.lineTo(f2.x, f2.y); ctx.lineTo(n2.x, n2.y); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* body */
  const lit = crashed ? 0.55 : 1;
  for (const b of Ty.box) drawBox(v.p, v.voff, T, N, b[0], b[1], b[2], b[3], b[4], rgb, lit);

  /* lamps */
  const flare = v.brake || 0;
  if (dir > 0 || v.state === 'exit'){
    for (const tl of Ty.tail){
      const r = Math.max(2.5, (26 + 30 * flare) * s);
      const a = (0.42 + 0.46 * flare).toFixed(2);
      const q = lamp(v, T, N, tl, tl[2], 'rgba(255,46,26,' + a + ')', r);
      ctx.fillStyle = flare > 0.35 ? 'rgba(255,150,130,0.95)' : 'rgba(255,110,86,0.85)';
      const d = Math.max(1, 1.5 * s * 1.6);
      ctx.fillRect(q.x - d / 2, q.y - d / 2, d, d);
      /* wet-road reflection */
      const rh = Math.max(3, (34 + 26 * flare) * s);
      const rgd = ctx.createLinearGradient(q.x, q.y, q.x, q.y + rh);
      rgd.addColorStop(0, 'rgba(255,48,26,' + (0.16 + 0.18 * flare).toFixed(2) + ')');
      rgd.addColorStop(1, 'rgba(255,40,20,0)');
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgd;
      ctx.fillRect(q.x - Math.max(1, 8 * s), q.y, Math.max(2, 16 * s), rh);
      ctx.globalCompositeOperation = 'source-over';
    }
  } else {
    for (const hl of Ty.head){
      const q = lamp(v, T, N, hl, hl[2], 'rgba(226,238,255,0.44)', Math.max(3, 46 * s));
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      const d = Math.max(1.2, 1.8 * s * 1.6);
      ctx.fillRect(q.x - d / 2, q.y - d / 2, d, d);
    }
  }
  if (Ty.marker){
    for (const m of Ty.marker){
      lamp(v, T, N, m, m[2], 'rgba(255,176,60,0.30)', Math.max(2, 12 * s));
    }
  }

  /* hazard flashers on the wreck; indicator on the turning vehicle */
  const blink = Math.sin((v.blink || 0) * 7) > 0;
  if (crashed && blink){
    glow(base.x, base.y, Math.max(5, 74 * s), 'rgba(255,168,20,0.5)', 'rgba(255,140,0,0)');
  }
  if (v.halt > S.t && blink){
    glow(base.x, base.y, Math.max(4, 46 * s), 'rgba(255,168,20,0.42)', 'rgba(255,140,0,0)');
  }
  if ((v.state === 'exit' || v.fate === 'exit') && blink){
    const q = proj(v.p - T.p * Ty.len * 0.45 - N.p * (Ty.wid * 0.55),
                   v.voff - T.v * Ty.len * 0.45 - N.v * (Ty.wid * 0.55), 0.9);
    ctx.globalCompositeOperation = 'lighter';
    glow(q.x, q.y, Math.max(3, 24 * s), 'rgba(255,176,36,0.9)', 'rgba(255,150,0,0)');
    ctx.globalCompositeOperation = 'source-over';
  }
}

/* small colour-coded track tag, only for the nearest few in the segment */
function drawTrackTags(){
  for (const v of S.veh){
    if (!v.trk || v.p < CFG.PA - 8 || v.p > CFG.PB + 8) continue;
    const q = proj(v.p, v.voff, v.T.box[v.T.box.length - 1][4] + 0.4);
    if (q.s < 0.24 || q.y < horizonY() || !onScreen(q, 40)) continue;
    const focus = S.focusVeh === v;
    ctx.font = (focus ? '700 ' : '') + '9px ' + MONO;
    ctx.textAlign = 'center';
    ctx.fillStyle = focus ? '#B2ECF6' : v.col;
    ctx.globalAlpha = focus ? 1 : 0.75;
    ctx.fillText(v.trk.slice(4), q.x, q.y - 4);
    ctx.globalAlpha = 1;
    if (focus){
      ctx.strokeStyle = 'rgba(150,220,235,0.5)'; ctx.lineWidth = 1;
      const r = Math.max(6, 18 * q.s);
      const c = proj(v.p, v.voff, 0.8);
      ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 7); ctx.stroke();
    }
    ctx.textAlign = 'left';
  }
}

/* ------------------------------------------------ pods / poles / tower */
function podTop(pd){ return proj(pd.p, pd.v + 2.6, pd.h - 0.4); }

/* ============================================================
   THE POD — the product, and the most detailed object in the scene.
   Built from projected quads: housing, angled dot-matrix face, tilted
   solar panel, sensor snout, pole clamp. No models, no loaders.
   ============================================================ */
const GLY = {
  'A':'01110100011000111111100011000110001','B':'11110100011000111110100011000111110',
  'C':'01110100011000010000100001000101110','D':'11110100011000110001100011000111110',
  'E':'11111100001000011110100001000011111','F':'11111100001000011110100001000010000',
  'G':'01110100011000010111100011000101111','H':'10001100011000111111100011000110001',
  'I':'01110001000010000100001000010001110','J':'00111000100001000010000110010011100',
  'K':'10001100101010011000101001001010001','L':'10000100001000010000100001000011111',
  'M':'10001110111010110101100011000110001','N':'10001110011010110011100011000110001',
  'O':'01110100011000110001100011000101110','P':'11110100011000111110100001000010000',
  'Q':'01110100011000110001101011001001101','R':'11110100011000111110101001001010001',
  'S':'01111100001000001110000010000111110','T':'11111001000010000100001000010000100',
  'U':'10001100011000110001100011000101110','V':'10001100011000110001100010101000100',
  'W':'10001100011000110101101011101110001','X':'10001100010101000100010101000110001',
  'Y':'10001100010101000100001000010000100','Z':'11111000010001000100010001000011111',
  '0':'01110100011001110101110011000101110','1':'00100011000010000100001000010001110',
  '2':'01110100010000100010001000100011111','3':'11111000100010000010000011000101110',
  '4':'00010001100101010010111110001000010','5':'11111100001111000001000011000101110',
  '6':'00110010001000011110100011000101110','7':'11111000010001000100010000100001000',
  '8':'01110100011000101110100011000101110','9':'01110100011000101111000010001001100',
  ' ':'00000000000000000000000000000000000','>':'00000010000010000001001000100000000',
  '/':'00001000100001000100010000100010000','-':'00000000000000001110000000000000000',
  '.':'00000000000000000000000000000000100','·':'00000000000000000010000000000000000'
};
const POD_BODY = [92, 100, 102];

function proj3(q){ return proj(q.p, q.v, q.h); }
function bilerp(TL, TR, BL, BR, u, w){
  const tx = TL.x + (TR.x - TL.x) * u, ty = TL.y + (TR.y - TL.y) * u;
  const bx = BL.x + (BR.x - BL.x) * u, by = BL.y + (BR.y - BL.y) * u;
  return { x: tx + (bx - tx) * w, y: ty + (by - ty) * w };
}

/* the amber dot-matrix readout, drawn onto the projected face plane */
function drawMatrix(o, T, N, face){
  const X = -0.502, y0 = -1.08, y1 = 1.08, z0 = -0.34, z1 = 0.40;
  const TL = proj3(LP(o, T, N, X, y0, z1)), TR = proj3(LP(o, T, N, X, y1, z1));
  const BL = proj3(LP(o, T, N, X, y0, z0)), BR = proj3(LP(o, T, N, X, y1, z0));
  poly3([LP(o, T, N, X, y0, z0), LP(o, T, N, X, y1, z0),
         LP(o, T, N, X, y1, z1), LP(o, T, N, X, y0, z1)], '#0b0803',
        'rgba(20,16,6,0.9)', 1);

  const txt = String(face || '').slice(0, 8).toUpperCase();
  const cols = Math.max(1, txt.length * 6 - 1), rows = 7;
  const pw = Math.hypot(TR.x - TL.x, TR.y - TL.y);
  const dot = pw / cols;

  ctx.globalCompositeOperation = 'lighter';
  if (dot < 0.55){
    /* too far to resolve individual pixels: an amber wash, as a real sign looks */
    poly3([LP(o, T, N, X, y0, z0), LP(o, T, N, X, y1, z0),
           LP(o, T, N, X, y1, z1), LP(o, T, N, X, y0, z1)], 'rgba(245,179,1,0.42)');
    ctx.globalCompositeOperation = 'source-over';
    return;
  }
  const ds = Math.max(0.55, dot * 0.80);
  for (let ci = 0; ci < txt.length; ci++){
    const g = GLY[txt[ci]] || GLY[' '];
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < 5; c++){
        const on = g.charCodeAt(r * 5 + c) === 49;
        if (!on && dot < 1.1) continue;
        const u = (ci * 6 + c + 0.5) / cols, w = (r + 0.5) / rows;
        const q = bilerp(TL, TR, BL, BR, u, w);
        ctx.fillStyle = on ? 'rgba(255,190,30,0.95)' : 'rgba(96,70,8,0.30)';
        ctx.fillRect(q.x - ds / 2, q.y - ds / 2, ds, ds);
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawPod(pd, label){
  const base = proj(pd.p, pd.v, 0);
  if (base.y < horizonY() - 40 || !onScreen(base, 320)) return;
  const MH = pd.h - 0.4;                       // mount height
  const o = { p: pd.p, v: pd.v + 2.6, h: MH }; // housing centre
  const fr = yawFrame(-0.42);                  // display angled toward oncoming traffic
  const T = fr.T, N = fr.N;                    // +x down-road, +y toward the carriageway
  const c = function(x, y, z){ return LP(o, T, N, x, y, z); };
  const B = POD_BODY;

  /* ---- pole and clamp bracket ---- */
  const pw = 0.10;
  poly3([{ p: pd.p - pw, v: pd.v - pw, h: 0 }, { p: pd.p - pw, v: pd.v + pw, h: 0 },
         { p: pd.p - pw, v: pd.v + pw, h: pd.h }, { p: pd.p - pw, v: pd.v - pw, h: pd.h }],
        shade(B, 0.26));
  poly3([{ p: pd.p - pw, v: pd.v + pw, h: 0 }, { p: pd.p + pw, v: pd.v + pw, h: 0 },
         { p: pd.p + pw, v: pd.v + pw, h: pd.h }, { p: pd.p - pw, v: pd.v + pw, h: pd.h }],
        shade(B, 0.17));
  /* two clamp bands wrapping the pole */
  for (const bz of [MH + 0.30, MH - 0.30]){
    const bw = 0.20;
    poly3([{ p: pd.p - bw, v: pd.v - bw, h: bz - 0.09 }, { p: pd.p - bw, v: pd.v + bw, h: bz - 0.09 },
           { p: pd.p - bw, v: pd.v + bw, h: bz + 0.09 }, { p: pd.p - bw, v: pd.v - bw, h: bz + 0.09 }],
          shade(B, 0.44), shade(B, 0.60, 0.7), 1);
    poly3([{ p: pd.p - bw, v: pd.v + bw, h: bz - 0.09 }, { p: pd.p + bw, v: pd.v + bw, h: bz - 0.09 },
           { p: pd.p + bw, v: pd.v + bw, h: bz + 0.09 }, { p: pd.p - bw, v: pd.v + bw, h: bz + 0.09 }],
          shade(B, 0.30));
  }
  /* arm out to the housing */
  poly3([{ p: pd.p - 0.07, v: pd.v, h: MH - 0.07 }, { p: pd.p - 0.07, v: o.v, h: MH - 0.07 },
         { p: pd.p - 0.07, v: o.v, h: MH + 0.07 }, { p: pd.p - 0.07, v: pd.v, h: MH + 0.07 }],
        shade(B, 0.30));

  const HD = 0.50, HW = 1.30, HZ = 0.72;
  const wpx = Math.hypot(proj3(c(-HD, HW, 0)).x - proj3(c(-HD, -HW, 0)).x,
                         proj3(c(-HD, HW, 0)).y - proj3(c(-HD, -HW, 0)).y);

  if (wpx < 11){
    /* far away: silhouette only, so it never turns into noise */
    poly3([c(-HD, -HW, -HZ), c(-HD, HW, -HZ), c(-HD, HW, HZ), c(-HD, -HW, HZ)], shade(B, 0.24));
    poly3([c(-HD, -HW, HZ), c(-HD, HW, HZ), c(HD, HW, HZ), c(HD, -HW, HZ)], shade(B, 0.40));
    drawMatrix(o, T, N, pd.face);
  } else {
    /* ---- housing: painter-ordered faces ---- */
    poly3([c(-HD, -HW, -HZ), c(HD, -HW, -HZ), c(HD, HW, -HZ), c(-HD, HW, -HZ)], shade(B, 0.07));
    poly3([c(HD, -HW, -HZ), c(HD, HW, -HZ), c(HD, HW, HZ), c(HD, -HW, HZ)], shade(B, 0.13));
    const sideA = [c(-HD, -HW, -HZ), c(HD, -HW, -HZ), c(HD, -HW, HZ), c(-HD, -HW, HZ)];
    const sideB = [c(-HD, HW, -HZ), c(HD, HW, -HZ), c(HD, HW, HZ), c(-HD, HW, HZ)];
    const yA = proj3(c(0, -HW, 0)).y, yB = proj3(c(0, HW, 0)).y;
    if (yA < yB){ poly3(sideA, shade(B, 0.16)); poly3(sideB, shade(B, 0.23)); }
    else        { poly3(sideB, shade(B, 0.23)); poly3(sideA, shade(B, 0.16)); }
    /* lit top surface */
    poly3([c(-HD, -HW, HZ), c(HD, -HW, HZ), c(HD, HW, HZ), c(-HD, HW, HZ)],
          shade(B, 0.44), shade(B, 0.58, 0.5), 1);
    /* front bezel, carrying the display */
    poly3([c(-HD, -HW, -HZ), c(-HD, HW, -HZ), c(-HD, HW, HZ), c(-HD, -HW, HZ)],
          shade(B, 0.27), shade(B, 0.46, 0.6), 1);

    /* ---- sensor snout on the carriageway-facing edge ---- */
    const s0 = HW, s1 = HW + 0.30;
    poly3([c(-0.30, s0, -0.18), c(0.10, s0, -0.18), c(0.10, s1, -0.18), c(-0.30, s1, -0.18)], shade(B, 0.12));
    poly3([c(-0.30, s0, 0.18), c(0.10, s0, 0.18), c(0.10, s1, 0.18), c(-0.30, s1, 0.18)], shade(B, 0.40));
    poly3([c(-0.30, s0, -0.18), c(-0.30, s1, -0.18), c(-0.30, s1, 0.18), c(-0.30, s0, 0.18)], shade(B, 0.30));
    poly3([c(-0.30, s1, -0.18), c(0.10, s1, -0.18), c(0.10, s1, 0.18), c(-0.30, s1, 0.18)],
          '#07090a', shade(B, 0.50, 0.55), 1);
    const ap = proj3(c(-0.10, s1 + 0.01, 0));
    ctx.globalCompositeOperation = 'lighter';
    glow(ap.x, ap.y, Math.max(1.2, wpx * 0.10), 'rgba(150,190,220,0.30)', 'rgba(120,160,200,0)');
    ctx.globalCompositeOperation = 'source-over';

    drawMatrix(o, T, N, pd.face);

    /* ---- solar panel, tilted back over the housing ---- */
    const pz = function(x){ return 0.80 + 0.24 * (0.80 - x) / 1.50; };
    const P1 = c(-0.70, -1.42, pz(-0.70)), P2 = c(-0.70, 1.42, pz(-0.70));
    const P3 = c(0.80, 1.42, pz(0.80)),   P4 = c(0.80, -1.42, pz(0.80));
    poly3([P1, P2, P3, P4], 'rgba(16,22,34,0.98)', 'rgba(130,145,160,0.55)', 1);
    if (wpx > 16){
      /* cell grid + a faint sheen so it reads as glass, not a black slab */
      const a = proj3(P1), b = proj3(P2), d2 = proj3(P4), e = proj3(P3);
      ctx.strokeStyle = 'rgba(120,140,170,0.20)'; ctx.lineWidth = 0.7;
      for (let i = 1; i < 4; i++){
        const u = i / 4;
        const q0 = { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
        const q1 = { x: d2.x + (e.x - d2.x) * u, y: d2.y + (e.y - d2.y) * u };
        ctx.beginPath(); ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
      ctx.lineTo((d2.x + e.x) / 2, (d2.y + e.y) / 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180,200,230,0.16)'; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    /* status LED on the bezel corner */
    const led = proj3(c(-HD - 0.02, -HW + 0.14, HZ - 0.14));
    const alive = Math.sin(performance.now() / 900) > -0.2;
    ctx.globalCompositeOperation = 'lighter';
    glow(led.x, led.y, Math.max(1.2, wpx * 0.07),
         alive ? 'rgba(90,230,150,0.75)' : 'rgba(90,230,150,0.18)', 'rgba(60,200,120,0)');
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---- amber spill from the display onto the housing and the air ---- */
  const dc = proj3(c(-0.55, 0, 0.02));
  ctx.globalCompositeOperation = 'lighter';
  glow(dc.x, dc.y, Math.max(6, wpx * 1.5), 'rgba(245,179,1,0.16)', 'rgba(245,179,1,0)');
  ctx.globalCompositeOperation = 'source-over';

  /* ---- readable label beside the pod ---- */
  const anchor = proj3(c(-HD, HW, HZ));
  const lx = anchor.x + 11, ly = anchor.y - 6;
  ctx.strokeStyle = 'rgba(245,179,1,0.30)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(anchor.x + 1, anchor.y); ctx.lineTo(lx - 3, ly + 2); ctx.stroke();
  ctx.textAlign = 'left';
  ctx.font = '700 11px ' + MONO; ctx.fillStyle = '#F5B301';
  ctx.fillText(label, lx, ly + 4);
  ctx.font = '10px ' + MONO;
  const tw = ctx.measureText(pd.face).width;
  ctx.fillStyle = 'rgba(10,7,3,0.9)'; ctx.fillRect(lx - 2, ly + 8, tw + 8, 13);
  ctx.strokeStyle = '#3a2c05'; ctx.strokeRect(lx - 1.5, ly + 8.5, tw + 7, 12);
  ctx.fillStyle = '#F5B301'; ctx.fillText(pd.face, lx + 2, ly + 18);
}

function drawTower(){
  const b = proj(TOWER.p, TOWER.v, 0), t = proj(TOWER.p, TOWER.v, TOWER.h);
  const hgt = b.y - t.y;
  if (hgt < 4) return;
  ctx.strokeStyle = '#2f3634'; ctx.lineWidth = 1;
  const halfB = Math.max(3, 46 * b.s), halfT = Math.max(1, halfB * 0.22);
  ctx.beginPath();
  ctx.moveTo(b.x - halfB, b.y); ctx.lineTo(t.x - halfT, t.y);
  ctx.moveTo(b.x + halfB, b.y); ctx.lineTo(t.x + halfT, t.y);
  ctx.stroke();
  for (let i = 0; i <= 8; i++){
    const f = i / 8, y = b.y - hgt * f, hw = halfB + (halfT - halfB) * f;
    ctx.beginPath(); ctx.moveTo(t.x - hw, y); ctx.lineTo(t.x + hw, y); ctx.stroke();
  }
  const beacon = Math.sin(performance.now() / 520) > 0.4;
  ctx.globalCompositeOperation = 'lighter';
  glow(t.x, t.y - 2, beacon ? 12 : 6,
       beacon ? 'rgba(255,60,45,0.9)' : 'rgba(255,60,45,0.3)', 'rgba(255,40,20,0)');
  ctx.globalCompositeOperation = 'source-over';
}

function drawPulse(){
  if (!TX.on) return;
  const pts = relayPods().map(podTop);
  pts.push(proj(TOWER.p, TOWER.v, TOWER.h - 4));
  const e = performance.now() / 1000 - TX.t0, HOP = 0.85;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < pts.length - 1; i++){
    const st = i * HOP, fr = (e - st) / HOP;
    if (fr <= 0) continue;
    const a = pts[i], b = pts[i + 1], done = Math.min(1, fr);
    ctx.strokeStyle = 'rgba(245,179,1,' + (0.14 + 0.18 * (1 - Math.min(1, (e - st) / 3))).toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x + (b.x - a.x) * done, a.y + (b.y - a.y) * done); ctx.stroke();
    if (fr < 1) glow(a.x + (b.x - a.x) * fr, a.y + (b.y - a.y) * fr, 12,
                     'rgba(255,236,180,0.95)', 'rgba(245,179,1,0)');
    else glow(b.x, b.y, 7 + 4 * Math.abs(Math.sin(e * 5)), 'rgba(245,179,1,0.6)', 'rgba(245,179,1,0)');
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ------------------------------------------- thin transmission strip */
function stripChip(x, y, txt, on, col){
  ctx.font = '700 9.5px ' + MONO;
  const w = ctx.measureText(txt).width + 12, h = 16;
  ctx.fillStyle = on ? 'rgba(40,29,2,0.95)' : 'rgba(14,18,19,0.85)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = on ? (col || '#F5B301') : '#2a3234'; ctx.lineWidth = 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  ctx.fillStyle = on ? (col || '#F5B301') : '#4d5658';
  ctx.textAlign = 'center'; ctx.fillText(txt, x + w / 2, y + 11); ctx.textAlign = 'left';
  return x + w;
}
function stripArrow(x, y, label, on){
  ctx.font = '9px ' + MONO;
  const w = Math.max(34, ctx.measureText(label).width + 12);
  ctx.strokeStyle = on ? '#F5B301' : '#2a3234'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 3, y + 8); ctx.lineTo(x + w - 4, y + 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + w - 8, y + 5); ctx.lineTo(x + w - 4, y + 8);
  ctx.lineTo(x + w - 8, y + 11); ctx.stroke();
  if (label){
    ctx.fillStyle = on ? '#F5B301' : '#3f4749';
    ctx.textAlign = 'center'; ctx.fillText(label, x + w / 2, y + 4); ctx.textAlign = 'left';
  }
  return x + w;
}
function drawLinkStrip(){
  const a = TX.alpha();
  if (a <= 0.01) return;
  const SH = 30, y0 = H - SH - 8, x0 = 14, x1 = W - 14;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(5,7,8,0.92)'; ctx.fillRect(x0, y0, x1 - x0, SH);
  ctx.strokeStyle = '#3a2c05'; ctx.lineWidth = 1;
  ctx.strokeRect(x0 + .5, y0 + .5, x1 - x0 - 1, SH - 1);
  const cy = y0 + 7;
  let x = x0 + 10;
  const chain = relayPods();
  for (let i = 0; i < chain.length; i++){
    const on = i === 0 ? true : (TX.hops[i - 1] && TX.hops[i - 1].lit);
    x = stripChip(x, cy, chain[i].id, on);
    const hp = TX.hops[i];
    if (hp) x = stripArrow(x, cy, hp.lit ? hp.ms + 'ms' : '', hp.lit);
  }
  const twOn = TX.hops.length && TX.hops[TX.hops.length - 1].lit;
  x = stripChip(x, cy, TOWER.id, twOn, '#FF6A5F');
  x = stripArrow(x, cy, '', twOn) + 4;
  for (let i = 0; i < TX.recv.length; i++){
    const r = TX.recv[i];
    ctx.fillStyle = r.lit ? '#FF3B2F' : '#2c3436';
    ctx.fillRect(x, cy + 5, 6, 6);
    ctx.font = '9.5px ' + MONO;
    ctx.fillStyle = r.lit ? '#FF6A5F' : '#454e50';
    ctx.fillText(r.s, x + 11, cy + 11);
    x += 13 + ctx.measureText(r.s).width + 12;
  }
  ctx.font = '9.5px ' + MONO;
  ctx.fillStyle = TX.done ? '#F5B301' : '#5d6668';
  ctx.textAlign = 'right';
  ctx.fillText(TX.done ? 'END-TO-END ' + (TX.baseAcc + TX.recv[2].ms) + ' ms' : 'DISPATCHING…',
               x1 - 10, cy + 11);
  ctx.textAlign = 'left';
  ctx.restore();
}

/* ============================================================
   TRANSMISSION — the alert leaving the road.
   Expanding rings from the originating pod, relayed hop by hop with a
   visible delay, a wider handoff wave at the tower, then three separate
   paths out to the recipients. The origin keeps calling while the
   incident stands.
   ============================================================ */
const HOP_S = 0.85;

function towerTop(){ return proj(TOWER.p, TOWER.v, TOWER.h - 2); }

/* concentric rings expanding from a point, flattened to sit on the ground plane */
function ringSet(pt, dt, o){
  /* rings are diagrammatic, so they only partly follow the zoom — otherwise a
     push-in turns them into screen-filling strokes */
  const zs = 1 + (CAM.z - 1) * 0.45;
  if (!onScreen(pt, o.r1 * zs)) return;
  for (let i = 0; i < o.n; i++){
    const a = dt - i * o.gap;
    if (a <= 0 || a > o.life) continue;
    const f = a / o.life;
    const r = (o.r0 + (o.r1 - o.r0) * f) * zs;
    const al = (1 - f) * (1 - f) * o.a;
    if (al < 0.004 || r < 1) continue;
    ctx.strokeStyle = o.col + al.toFixed(3) + ')';
    ctx.lineWidth = Math.max(0.6, o.lw * (1 - f * 0.55));
    ctx.beginPath();
    ctx.ellipse(pt.x, pt.y, r, r * 0.42, 0, 0, 6.2832);
    ctx.stroke();
  }
}

function recipAnchors(tp){
  const d = Math.min(180, W * 0.12);
  const a = [
    { x: tp.x + d * 0.62, y: tp.y - d * 0.46 },
    { x: tp.x + d * 0.98, y: tp.y - d * 0.02 },
    { x: tp.x + d * 0.58, y: tp.y + d * 0.42 }
  ];
  for (let i = 0; i < 3; i++){
    a[i].x = Math.min(a[i].x, W - 96);
    a[i].y = clamp(a[i].y, 34, H - 140);
    a[i].s = RECIP[i].s;
  }
  return a;
}

function drawTxNetwork(){
  const now = performance.now() / 1000;
  const sus = ANTAR.sus;
  const calling = !!(sus && sus.settled && sus.verdict === 'dispatch');
  if (!calling && !TX.on) return;

  ctx.globalCompositeOperation = 'lighter';

  /* the road is still calling: a slow, steady beat from the originating pod */
  if (calling){
    const period = 2.6;
    const beat = (now % period) / period;
    ringSet(podTop(POD.A), beat * period,
            { n: 1, gap: 0, life: period, r0: 9, r1: 132, a: 0.26, lw: 1.5,
              col: 'rgba(245,179,1,' });
  }

  if (TX.on){
    const e = now - TX.t0;
    const chain = relayPods();

    /* each pod fires its own ripple only once the wave has reached it */
    for (let k = 0; k < chain.length; k++){
      ringSet(podTop(chain[k]), e - k * HOP_S,
              { n: 3, gap: 0.38, life: 1.5, r0: 7, r1: 104, a: 0.55, lw: 1.6,
                col: 'rgba(255,206,96,' });
    }

    /* the handoff: wider, slower, a different colour temperature */
    const tt = chain.length * HOP_S, tp = towerTop();
    ringSet(tp, e - tt, { n: 3, gap: 0.50, life: 2.8, r0: 12, r1: 300, a: 0.46, lw: 2.1,
                          col: 'rgba(255,138,78,' });
    if (e > tt){
      const flash = c01(1 - (e - tt) / 0.8);
      if (flash > 0)
        glow(tp.x, tp.y, (24 + 46 * flash) * (1 + (CAM.z - 1) * 0.45),
             'rgba(255,158,96,' + (0.6 * flash).toFixed(3) + ')', 'rgba(255,120,60,0)');
    }

    /* three separate paths out, arriving one after another */
    const anc = recipAnchors(tp);
    for (let i = 0; i < anc.length; i++){
      const st = tt + 0.30 + i * 0.55, a = e - st;
      if (a <= 0) continue;
      const f = c01(a / 0.52);
      const hx = tp.x + (anc[i].x - tp.x) * f, hy = tp.y + (anc[i].y - tp.y) * f;
      ctx.strokeStyle = 'rgba(255,120,74,' + (0.16 + 0.30 * (1 - f)).toFixed(3) + ')';
      ctx.lineWidth = 1.3;
      ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(tp.x, tp.y); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.setLineDash([]);
      if (f < 1){
        glow(hx, hy, 11, 'rgba(255,206,150,0.9)', 'rgba(255,140,70,0)');
      } else {
        ringSet(anc[i], a - 0.52, { n: 2, gap: 0.34, life: 1.3, r0: 5, r1: 46,
                                     a: 0.5, lw: 1.4, col: 'rgba(255,90,60,' });
        glow(anc[i].x, anc[i].y, 9, 'rgba(255,120,80,0.55)', 'rgba(255,80,50,0)');
      }
    }

    /* recipient labels sit on top, unblended, so they stay readable */
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = '700 9.5px ' + MONO;
    for (let i = 0; i < anc.length; i++){
      const st = tt + 0.30 + i * 0.55;
      if (e - st < 0.52) continue;
      const lit = TX.recv[i] && TX.recv[i].lit;
      const tw = ctx.measureText(anc[i].s).width;
      ctx.fillStyle = 'rgba(6,8,9,0.85)';
      ctx.fillRect(anc[i].x + 8, anc[i].y - 7, tw + 10, 14);
      ctx.strokeStyle = lit ? 'rgba(255,59,47,0.75)' : 'rgba(70,80,82,0.7)';
      ctx.lineWidth = 1;
      ctx.strokeRect(anc[i].x + 8.5, anc[i].y - 6.5, tw + 9, 13);
      ctx.fillStyle = lit ? '#FF8A72' : '#5d6668';
      ctx.fillText(anc[i].s, anc[i].x + 13, anc[i].y + 3);
    }
    ctx.globalCompositeOperation = 'lighter';
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* a whisper of a camera indicator, only when not in the default view */
function drawCamBadge(){
  if (CAM.mode === 'wide' && CAM.z === 1) return;
  ctx.font = '9px ' + MONO;
  ctx.fillStyle = 'rgba(90,100,102,0.8)';
  ctx.textAlign = 'right';
  ctx.fillText('CLOSE VIEW  ×' + CAM.z.toFixed(1), W - 14, 20);
  ctx.textAlign = 'left';
}

/* ------------------------------------------------------------ compose */
function render(){
  ctx.clearRect(0, 0, W, H);
  drawSky();
  drawGround();
  drawVillagePad();
  drawBranch();
  drawVillage();
  drawFlora();
  drawShop();
  drawMilestone();
  drawSign();

  const all = [];
  for (const v of S.veh) all.push({ v: v, d: 1 });
  for (const o of S.onc) all.push({ v: o, d: -1 });
  all.sort(function(a, b){ return b.v.p - a.v.p; });

  if (POD.D.enabled) drawPod(POD.D, 'POD D');
  if (POD.C.enabled) drawPod(POD.C, 'POD C');
  drawTower();
  drawPod(POD.B, 'POD B');
  for (const e of all) drawVehicle(e.v, e.d);
  drawSmoke();
  drawPod(POD.A, 'POD A');
  drawTrackTags();
  drawPulse();
  drawTxNetwork();
  drawLinkStrip();
  drawCamBadge();
}


/* ================================================================
   CONSOLE — shows only what ANTAR actually perceives
   ================================================================ */
const $ = function(id){ return document.getElementById(id); };
const LOGS = [];
function logEvt(cls, text){
  if (S.quiet) return;
  LOGS.push({ t: S.t, c: cls, x: text });
  if (LOGS.length > 220) LOGS.shift();
}
const TIER = ['LOW', 'MEDIUM', 'HIGH'];

function row(k, v, c){
  return '<div class="rowv"><em>' + k + '</em><b class="' + (c || '') + '">' + v + '</b></div>';
}
function stepHTML(st, collapsed){
  let s = '<div class="step ' + st.cls + (collapsed ? ' col' : '') + '">' +
          '<div class="ic">' + st.ic + '</div><div>' +
          '<div class="hd"><span class="tt">' + st.tt + '</span><span class="ts">' + st.ts + '</span></div>';
  if (!collapsed){
    if (st.kv && st.kv.length){
      s += '<div class="kv">';
      for (const p of st.kv) s += '<span><em>' + p[0] + '</em> <b class="' + (p[2] || '') + '">' + p[1] + '</b></span>';
      s += '</div>';
    }
    if (st.why) s += '<div class="why">' + st.why + '</div>';
  }
  return s + '</div></div>';
}

const UI = {
  trk: null, sus: null, last: 0,

  focus(trk){ this.trk = trk; this.sus = null; },
  /* the tracked vehicle may open the segment event, or join one already open —
     either way the checklist follows that event */
  onSuspicion(s){
    if (!this.trk || this.trk.state === 'closed') return;
    if (s.trk === this.trk || s.extra.indexOf(this.trk) >= 0 || this.trk.state === 'missed')
      this.sus = s;
  },
  onSettle(s){ },

  /* ------------------------------------------------ decision checklist */
  steps(){
    const k = this.trk, t = S.t, out = [];
    if (!k) return out;
    const s = this.sus, D = k.dist;

    out.push({ cls: 'ok', ic: '1', tt: 'VEHICLE DETECTED · POD A', ts: clk(k.tA), kv: [
      ['TRACK', k.id, 'n'],
      ['CLASS', k.cls + ' · ' + k.len.toFixed(1) + ' m', 'n'],
      ['SPEED', kmh(k.vA).toFixed(1) + ' km/h']
    ], why: 'POD A knows three things: something passed, how fast, and how long it was, plus its inductive signature. No plate, no camera, no destination. Every inference below is built from those numbers alone.' });

    out.push({ cls: 'ok', ic: '2', tt: 'ARRIVAL WINDOW OPENED', ts: clk(k.tA), kv: [
      ['TO POD B', D + ' m'],
      ['ETA', clk(k.tExp) + ' (' + rel(k.tExp - k.tA) + ')'],
      ['TOLERANCE', rel(k.tEarly - k.tA) + ' … ' + rel(k.tLate - k.tA), 'n'],
      ['MATCH BY', 'WINDOW + CLASS + SIGNATURE', 'n']
    ], why: 'Expected arrival at POD B from the measured speed. The window spans 0.55×–1.30× of that, because on a road shared by a bus, a tractor-trailer and a motorcycle, getting stuck behind something slow is normal and must not read as an incident.' });

    if (k.state === 'open'){
      out.push({ cls: 'pending live', ic: '3', tt: 'AWAITING POD B MATCH', ts: clk(t), kv: [
        ['WINDOW LEFT', (k.tLate - t).toFixed(1) + ' s'],
        ['ELAPSED', (t - k.tA).toFixed(1) + ' s', 'n']
      ], why: 'A matching pass at POD B inside the window closes the track. Only an exhausted window with no match counts as an absence.' });
      if (!s) return out;
    } else if (k.state === 'closed'){
      out.push({ cls: 'ok', ic: '3', tt: 'POD B MATCHED · TRACK CLOSED', ts: clk(k.tB), kv: [
        ['ARRIVAL DELTA', rel(k.tB - k.tExp), 'g'],
        ['POD B SPEED', kmh(k.vB).toFixed(1) + ' km/h'],
        ['SIG DISTANCE', (k.dSig === null ? '—' : k.dSig.toFixed(3)) + ' / 0.160 gate', 'g'],
        ['TRIP MEAN', kmh(D / (k.tB - k.tA)).toFixed(1) + ' km/h', 'n']
      ], why: 'The vehicle arrived as predicted. No absence, no suspicion, no resources spent — this is the path almost every vehicle takes.' });
      out.push({ cls: 'ok', ic: '4', tt: 'DECISION · NO ANOMALY', ts: clk(k.tB), kv: [
        ['RESULT', 'NORMAL PASS', 'g'], ['DISPATCH', 'NONE', 'n']
      ], why: 'The pass matched end to end. Nothing was raised, nothing was sent. A quiet system is a working system.' });
      return out;
    }

    if (k.state === 'missed'){
      out.push({ cls: 'warn', ic: '3', tt: 'WINDOW EXPIRED · NO MATCH AT POD B', ts: clk(k.tLate), kv: [
        ['ABSENT FOR', (t - k.tLate).toFixed(1) + ' s'],
        ['POD B MATCH', 'NONE', 'r']
      ], why: 'An absence is not a crash. A turn-off to a village, a field track, a tea stall, a roadside halt — all of them look identical from POD A. To tell them apart, the road itself has to testify.' });
    }

    if (!s) return out;

    const origin = s.trk === k;
    out.push({ cls: 'warn', ic: '4', tt: 'SEGMENT EVENT OPENED', ts: clk(s.tOpen), kv: [
      ['EVENT', s.evt, 'n'],
      ['OPENED BY', s.trk.id + (origin ? ' (this track)' : ''), 'n'],
      ['THIS TRACK', origin ? 'ORIGIN' : (k.state === 'open' ? 'IN SEGMENT' : 'JOINED'), 'n'],
      ['DISPATCH', 'HELD', 'n']
    ], why: 'An event belongs to the segment, not to one vehicle — whichever absence is noticed first opens it, and every later absence folds into the same event. One absence is not enough to wake anyone up, so ANTAR does exactly one thing here: it starts watching the traffic behind.' });

    const remain = Math.max(0, s.tClose - t);
    out.push({ cls: s.settled ? 'dead' : 'live warn', ic: '5',
      tt: 'CORROBORATION WINDOW · UP TO ' + CFG.CORROB + ' s',
      ts: s.settled ? clk(s.tSettle) : clk(t),
      kv: s.settled ? [['CLOSED AFTER', (s.tSettle - s.tOpen).toFixed(1) + ' s', 'n'],
                       ['REASON', s.note, 'n']]
                    : [['REMAINING', remain.toFixed(1) + ' s'],
                       ['OBSERVED', (t - s.tOpen).toFixed(1) + ' s', 'n'],
                       ['WATCHING', 'POD B FLOW + PASS SPEED', 'n']],
      why: 'A blockage leaves marks downstream: vehicles behind brake, crawl, swerve around it and queue, and arrivals at POD B thin out. A legal turn-off leaves nothing at all. These ' + CFG.CORROB + ' seconds exist to tell those two apart. This simulation models that behaviour; it has not been checked against real crash data.' });

    const f = s.f, sp = s.sp;
    if (f){
      const rp = f.ratio === null ? 'INSUFFICIENT' : (f.ratio * 100).toFixed(0) + '%';
      const rc = f.ratio === null ? 'n' : (f.ratio < 0.5 ? 'r' : f.ratio < 0.85 ? '' : 'g');
      let why;
      if (f.ratio === null) why = 'Not enough downstream samples to compare yet. Still accumulating.';
      else if (f.ratio >= 0.85) why = 'Arrivals at POD B still match the inflow measured at POD A. The traffic behind noticed nothing at all — the road is not corroborating a crash.';
      else why = 'Arrivals downstream fall short of upstream inflow by ' + f.gap.toFixed(1) +
                 ' veh/min. One vehicle taking a turn-off does not make other vehicles disappear — this gap needs a different explanation.';
      out.push({ cls: s.settled ? 'dead' : 'live', ic: '6', tt: 'DOWNSTREAM FLOW · ROLLING 90 s',
        ts: s.settled ? clk(s.tSettle) : clk(t), kv: [
          ['EXPECTED', f.exp.toFixed(1) + ' veh/min', 'n'],
          ['OBSERVED', f.act.toFixed(1) + ' veh/min', rc],
          ['GAP', f.gap.toFixed(1) + ' veh/min', f.gap > 2 ? 'r' : 'g'],
          ['RATIO', rp, rc],
          ['UPSTREAM', kmh(sp.up).toFixed(0) + ' km/h', 'n'],
          ['DOWNSTREAM', sp.n === 0 ? 'NO ARRIVALS' : kmh(sp.dn).toFixed(0) + ' km/h',
                         (sp.n === 0 || sp.drop > 0.25) ? 'r' : 'n'],
          ['ABSENCES IN EVENT', String(1 + s.extra.length), s.extra.length ? 'r' : 'g']
        ], why: why });
    }

    const tc = s.tier === 2 ? 'alert' : s.tier === 1 ? 'warn' : 'ok';
    out.push({ cls: (s.settled ? '' : 'live ') + tc, ic: '7', tt: 'CONFIDENCE · ' + TIER[s.tier],
      ts: s.settled ? clk(s.tSettle) : clk(t), kv: [
        ['VALUE', s.conf.toFixed(2), s.tier === 2 ? 'r' : ''],
        ['THRESHOLD', 'DISPATCH NOW ≥ 0.82 · AT WINDOW CLOSE ≥ 0.66', 'n'],
        ['BREAKDOWN', 'absence .18 + flow ' + (s.parts ? s.parts.evFlow.toFixed(2) : '.00') +
                      ' + speed ' + (s.parts ? s.parts.evSpeed.toFixed(2) : '.00') +
                      ' + knock-on ' + (s.parts ? s.parts.evMiss.toFixed(2) : '.00'), 'n']
      ], why: s.reason });

    if (!s.settled){
      out.push({ cls: 'pending', ic: '8', tt: 'DECISION · PENDING', ts: '—',
        kv: [['STATE', 'GATHERING EVIDENCE', 'n']],
        why: 'Confidence is a continuous range, not a switch. Without evidence, ANTAR does nothing at all.' });
      return out;
    }

    if (s.verdict === 'dispatch'){
      out.push({ cls: 'alert', ic: '8', tt: 'DECISION · ALERT DISPATCHED', ts: clk(s.tSettle), kv: [
        ['CONFIDENCE', s.conf.toFixed(2) + ' · HIGH', 'r'],
        ['CALL', 'BLOCKING EVENT BETWEEN POD A AND POD B', 'r'],
        ['TRIGGER', s.note, 'n']
      ], why: 'Confidence crossed the dispatch threshold. Absence, flow collapse, speed drop and knock-on misses all corroborate each other, and a blockage is by far the likeliest explanation for all four at once.' });
      const hopsLit = TX.hops.filter(function(x){ return x.lit; }).length;
      const rcv = TX.recv.filter(function(x){ return x.lit; }).length;
      out.push({ cls: TX.done ? 'alert' : 'live alert', ic: '9',
        tt: TX.done ? 'TRANSMISSION COMPLETE · ACKNOWLEDGED' : 'TRANSMITTING · MESH RELAY',
        ts: clk(s.tSettle), kv: [
          ['HOPS', hopsLit + ' / ' + TX.hops.length, 'r'],
          ['LATENCY', (hopsLit ? TX.hops[hopsLit - 1].acc : 0) + ' ms', 'n'],
          ['RECIPIENTS', rcv + ' / 3 ACKNOWLEDGED', rcv === 3 ? 'r' : 'n']
        ], why: 'Simulated relay: the alert hops pod to pod until one reaches cellular coverage, then the tower delivers it to the three recipients. All of this is modelled — no message leaves this browser. Pods carry it to the tower; the tower carries it to people.' });
    } else {
      out.push({ cls: 'ok', ic: '8', tt: 'DECISION · SUSPICION CLEARED · LEGAL EXIT', ts: clk(s.tSettle), kv: [
        ['CONFIDENCE', s.conf.toFixed(2) + ' · LOW', 'g'],
        ['CALL', 'VEHICLE LEFT THE SEGMENT LEGALLY', 'g'],
        ['DISPATCH', 'NONE', 'g']
      ], why: 'In ' + CFG.CORROB + ' seconds the road offered no corroboration: flow held, speed held, nothing else went missing. ANTAR closes the suspicion and files it — no dispatch, no interruption. The cost of a false alarm stays with the system, not with a hospital.' });
    }
    return out;
  },

  checklist(){
    const st = this.steps();
    if (!st.length){
      return '<div class="empty">No track selected.<br><br>' +
             'The simulator is already running: POD A and POD B are holding an arrival ' +
             'window open on every vehicle in the segment at once — see ACTIVE TRACKS.<br><br>' +
             'Press <b>SCENARIO A / B / C</b> — the next vehicle past POD A becomes the tracked one.</div>';
    }
    const cut = Math.max(0, st.length - 3);
    let h = '';
    for (let i = 0; i < st.length; i++) h += stepHTML(st[i], i < cut);
    return h;
  },

  /* ------------------------------------------- evidence: flow up front */
  flowBlock(F, live){
    const exp = F.exp, act = F.act, gap = F.gap;
    const mx = Math.max(exp, act, 1);
    const obsPct = c01(act / mx) * 100, gapPct = c01(gap / mx) * 100;
    const low = F.ratio !== null && F.ratio < 0.75;
    return '<div id="flowblk"><div class="lb">DOWNSTREAM FLOW · POD B · ROLLING 90 s</div>' +
      '<div class="fgrid">' +
        '<div class="fcell exp"><div class="k">EXPECTED</div><div class="v">' + exp.toFixed(1) +
          '</div><div class="u">VEH / MIN · POD A, LAGGED</div></div>' +
        '<div class="fcell obs' + (low ? ' lowv' : '') + '"><div class="k">OBSERVED</div><div class="v">' +
          act.toFixed(1) + '</div><div class="u">VEH / MIN · AT POD B</div></div>' +
      '</div>' +
      '<div id="gapbar"><div class="obsf" style="width:' + obsPct.toFixed(1) + '%"></div>' +
        '<div class="gapf" style="left:' + obsPct.toFixed(1) + '%;width:' + gapPct.toFixed(1) + '%"></div>' +
        '<div class="cap">' + (F.ratio === null ? 'SAMPLING' : (F.ratio * 100).toFixed(0) + '% ARRIVING') + '</div></div>' +
      '<div class="gaprow"><em>SHORTFALL</em><b class="' + (gap > 2 ? 'r' : '') + '">' +
        gap.toFixed(1) + ' veh/min</b></div>' +
      (live ? '<canvas id="spark"></canvas>' : '') +
      '</div>';
  },

  evidence(){
    const s = this.sus, t = S.t;
    const f = ANTAR.flow(t), sp = ANTAR.speeds(t);
    let h = this.flowBlock(s && s.f ? s.f : f, !!s);

    if (!s){
      h += '<div class="blk"><div class="lb">STATUS</div><div class="big d">NO ACTIVE EVENT</div>' +
           '<div class="sub">FLOW HELD · NOTHING MISSING</div></div>';
      h += '<div class="blk"><div class="lb">BASELINE</div>' +
           row('UPSTREAM SPEED', kmh(sp.up).toFixed(0) + ' km/h') +
           row('DOWNSTREAM SPEED', sp.n === 0 ? 'NO ARRIVALS' : kmh(sp.dn).toFixed(0) + ' km/h') +
           row('OPEN TRACKS', String(ANTAR.tracks.filter(function(k){ return k.state === 'open'; }).length), 'd') +
           '</div>';
      h += '<div class="blk"><div class="lb">PRINCIPLE</div><div class="topo">' +
           'ANTAR runs no video and knows no vehicle identity.<br>' +
           'All it holds is: <b>when, how fast, how long, past which pod</b>.<br>' +
           'The evidence for a crash is not on the vehicle that vanished — ' +
           'it is on the vehicles behind it.</div></div>';
      return h;
    }

    const cf = s.conf, pct = (cf * 100).toFixed(0);
    h += '<div class="blk"><div class="lb">CONFIDENCE</div>' +
         '<div class="big' + (s.tier === 2 ? ' r' : '') + '">' + cf.toFixed(2) +
         '<span style="font-size:12px;letter-spacing:.2em;margin-left:10px">' + TIER[s.tier] + '</span></div>' +
         '<div id="confBar"><div id="confFill" style="width:' + pct + '%"></div>' +
         '<div class="dv" style="left:35%"></div><div class="dv" style="left:66%"></div>' +
         '<div class="mk" style="left:calc(' + pct + '% - 1px)"></div></div>' +
         '<div class="tiers"><span class="' + (s.tier === 0 ? 'on' : '') + '">LOW &lt;0.35</span>' +
         '<span class="' + (s.tier === 1 ? 'on' : '') + '">MED</span>' +
         '<span class="hi ' + (s.tier === 2 ? 'on' : '') + '">HIGH ≥0.66 · NOW ≥0.82</span></div></div>';

    const remain = Math.max(0, s.tClose - t);
    const prog = c01(1 - remain / CFG.CORROB) * 100;
    h += '<div class="blk"><div class="lb">CORROBORATION WINDOW</div>' +
         '<div class="big' + (s.settled ? ' d' : '') + '">' +
         (s.settled ? 'CLOSED' : remain.toFixed(1) + ' s') + '</div>' +
         '<div class="prog"><i style="width:' + (s.settled ? 100 : prog).toFixed(1) + '%"></i></div>' +
         '<div class="sub">' + (s.settled ? s.note : 'MONITORING DOWNSTREAM FLOW') + '</div></div>';

    const SP = s.sp || sp;
    const P = s.parts || { evAbs: 0.18, evFlow: 0, evSpeed: 0, evMiss: 0 };
    h += '<div class="blk"><div class="lb">EVIDENCE WEIGHTS</div>' +
         row('ABSENCE (BASE)', '+' + P.evAbs.toFixed(2), 'd') +
         row('FLOW SHORTFALL', '+' + P.evFlow.toFixed(2), P.evFlow > 0.1 ? 'a' : 'd') +
         row('SPEED DROP', '+' + P.evSpeed.toFixed(2), P.evSpeed > 0.05 ? 'a' : 'd') +
         row('KNOCK-ON MISSES', '+' + P.evMiss.toFixed(2), P.evMiss > 0.05 ? 'a' : 'd') +
         row('PASS SPEED', (SP.n === 0 ? 'NO ARRIVALS' : kmh(SP.dn).toFixed(0) + ' km/h') +
                           '  (up ' + kmh(SP.up).toFixed(0) + ')',
             (SP.n === 0 || SP.drop > 0.25) ? 'r' : '') +
         '</div>';
    return h;
  },

  /* --------------------------------- active tracks + link + event log */
  tracksTable(){
    const t = S.t;
    const rows = ANTAR.tracks.filter(function(k){
      if (k.void) return false;
      if (k.state === 'open') return true;
      return t - (k.tB || k.tLate) < 12;          // linger briefly after closing
    }).slice(-9).reverse();

    let h = '<div class="tt-head"><span></span><span>TRACK</span><span>CLS</span>' +
            '<span>km/h</span><span>WINDOW</span></div>';
    if (!rows.length) h += '<div class="tnote">No open tracks.</div>';
    for (const k of rows){
      const col = S.colorOf[k.id] || '#4d5658';
      const focus = this.trk === k;
      let st, cls;
      if (k.state === 'open'){
        cls = 'open';
        st = 'OPEN · ' + Math.max(0, k.tLate - t).toFixed(0) + 's left';
      } else if (k.state === 'closed'){
        cls = 'closed'; st = 'MATCHED ' + rel(k.tB - k.tExp);
      } else {
        cls = 'missed'; st = 'NO MATCH';
      }
      h += '<div class="tt-row ' + cls + (focus ? ' focus' : '') + '">' +
           '<span class="sw" style="background:' + col + '"></span>' +
           '<span class="id">' + k.id + '</span>' +
           '<span class="ty">' + k.cls + '</span>' +
           '<span>' + kmh(k.vA).toFixed(0) + '</span>' +
           '<span class="st">' + st + '</span></div>';
    }
    h += '<div class="tnote">Every vehicle in the segment carries its own window, ' +
         'running in parallel. Colour swatches are a demo aid so you can find a row on the ' +
         'road — the pods never see colour.</div>';
    return h;
  },

  linkPane(){
    let h = this.tracksTable();
    h += '<div class="blk"><div class="lb">PAIRING TOPOLOGY</div><div class="topo">' +
         '<b>POD A</b> <span class="ar">&#8646;</span> <b>POD B</b>&nbsp;&nbsp;anchor pair · ' +
         (CFG.PB - CFG.PA) + ' m<br>' +
         '<b>POD B</b> <span class="ar">&#8594;</span> <b>TOWER-07</b>&nbsp;&nbsp;cellular uplink<br>' +
         '<b>TOWER-07</b> <span class="ar">&#8594;</span> 3 recipients (simulated)' +
         '</div><div class="motto">Pods carry it to the tower. <b>The tower carries it to people.</b></div></div>';

    h += '<div class="blk"><div class="lb">POD STATUS · DISPLAY FACE</div>';
    const chain = relayPods();
    for (let i = 0; i < chain.length; i++){
      const pd = chain[i];
      let cls = 'up';
      if (TX.on && (i === 0 || (TX.hops[i - 1] && TX.hops[i - 1].lit))) cls = 'tx';
      h += '<div class="node ' + cls + '"><div class="d"></div><em>' + pd.id + '</em>' +
           '<span>RSSI ' + pd.rssi + ' dBm · SOLAR ' + pd.bat + '%</span></div>' +
           '<div class="face">' + pd.face + '</div>';
    }
    const twOn = TX.on && TX.hops.length && TX.hops[TX.hops.length - 1].lit;
    h += '<div class="node ' + (twOn ? 'rx' : 'up') + '"><div class="d"></div><em>TOWER-07</em>' +
         '<span>4G · ' + (twOn ? 'CARRYING' : 'IDLE') + '</span></div>';
    if (POD.C.enabled) h += '<div class="sub" style="margin-top:6px">SPARE RELAYS ENGAGED</div>';
    h += '</div>';

    h += '<div class="blk"><div class="lb">RECIPIENTS · SIMULATED, NOT A LIVE INTEGRATION</div>';
    for (let i = 0; i < RECIP.length; i++){
      const lit = TX.on && TX.recv[i] && TX.recv[i].lit;
      h += '<div class="node ' + (lit ? 'rx' : '') + '"><div class="d"></div>' +
           '<em' + (lit ? '' : ' style="color:#5d6668"') + '>' + RECIP[i].n + '</em>' +
           '<span>' + (lit ? 'ACK ' + (TX.baseAcc + TX.recv[i].ms) + ' ms' : 'IDLE') + '</span></div>';
    }
    h += '</div>';

    h += '<div class="blk" style="border:none"><div class="lb">EVENT LOG · ALL TIMESTAMPED</div></div>';
    for (let i = LOGS.length - 1, n = 0; i >= 0 && n < 60; i--, n++){
      const L = LOGS[i];
      h += '<div class="lg ' + L.c + '"><t>' + clk(L.t).slice(0, 8) + '</t><span>' + L.x + '</span></div>';
    }
    return h;
  },

  spark(){
    const c = $('spark');
    if (!c || !this.sus) return;
    const s = this.sus, w = c.clientWidth, hh = 58;
    c.width = Math.round(w * DPR); c.height = Math.round(hh * DPR);
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, w, hh);
    const H0 = s.hist;
    if (H0.length < 2) return;
    let mx = 1;
    for (const p of H0) mx = Math.max(mx, p.exp, p.act);
    mx *= 1.25;
    const t0 = s.tOpen, t1 = s.tClose;
    const X = function(t){ return c01((t - t0) / (t1 - t0)) * (w - 2) + 1; };
    const Y = function(v){ return hh - 3 - (v / mx) * (hh - 13); };
    g.strokeStyle = '#1a2122'; g.lineWidth = 1;
    for (let i = 1; i < 4; i++){
      const y = 3 + (hh - 13) * i / 4;
      g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    }
    g.fillStyle = 'rgba(255,59,47,0.18)';
    g.beginPath();
    H0.forEach(function(p, i){ const x = X(p.t), y = Y(p.exp); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    for (let i = H0.length - 1; i >= 0; i--) g.lineTo(X(H0[i].t), Y(H0[i].act));
    g.closePath(); g.fill();
    g.strokeStyle = '#6d7679'; g.lineWidth = 1.2; g.beginPath();
    H0.forEach(function(p, i){ const x = X(p.t), y = Y(p.exp); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    g.strokeStyle = '#F5B301'; g.lineWidth = 1.7; g.beginPath();
    H0.forEach(function(p, i){ const x = X(p.t), y = Y(p.act); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    g.font = '9px ' + MONO;
    g.fillStyle = '#6d7679'; g.fillText('EXPECTED', 4, 10);
    g.fillStyle = '#F5B301'; g.fillText('OBSERVED', 62, 10);
    g.fillStyle = '#7a3a34'; g.textAlign = 'right';
    g.fillText('SHORTFALL', w - 4, 10);
    g.textAlign = 'left';
  },

  paint(){
    const panes = [['chk', this.checklist()], ['ev', this.evidence()], ['rt', this.linkPane()]];
    for (const p of panes){
      const el = $(p[0]);
      const st = el.scrollTop;
      el.innerHTML = p[1];
      el.scrollTop = st;
    }
    this.spark();

    $('clk').textContent = clk(S.t);
    const f = ANTAR.flow(S.t);
    $('chkHint').textContent = this.trk ? this.trk.id : '';
    $('pFlow').textContent = 'INFLOW ' + f.exp.toFixed(1) + '/min';
    const open = ANTAR.tracks.filter(function(k){ return k.state === 'open'; }).length;
    $('pTrk').textContent = 'OPEN ' + open;
    $('rtHint').textContent = open + ' IN SEGMENT';
    const m = $('pMode'), s = this.sus;
    m.className = 'pill';
    if (s && !s.settled){ m.textContent = s.evt + ' · CORROBORATING'; m.className = 'pill warm'; }
    else if (s && s.verdict === 'dispatch'){ m.textContent = 'ALERT DISPATCHED · ' + s.evt; m.className = 'pill hot'; }
    else if (s && s.verdict === 'dismiss'){ m.textContent = 'CLEARED · ' + s.evt; }
    else if (S.armed){ m.textContent = 'ARMED · AWAITING PASS'; m.className = 'pill warm'; }
    else if (this.trk){ m.textContent = 'TRACKING · ' + this.trk.id; }
    else m.textContent = 'STANDBY';
  }
};


/* ================================================================
   SCENARIO CONTROL — the user picks a scenario; everything else runs itself
   ================================================================ */
/* A scenario press restarts the demo from a clean, reproducible road: the
   previous run's wreck, queue and depressed statistics are all cleared, then a
   silent warm-up re-establishes the free-flow baseline the pods measure against. */
function resetRun(){
  ANTAR.sus = null; ANTAR.tracks.length = 0; ANTAR.aDet.length = 0; ANTAR.bDet.length = 0;
  TX.reset();
  SMOKE.length = 0;
  S.veh.length = 0; S.onc.length = 0;
  S.secondary = null; S.halter = null; S.focusVeh = null; S.armed = null;
  S.spawnIn = 0; S.oncIn = 2; S.colorOf = {};
  POD.A.face = 'A ONLINE'; POD.B.face = 'B LINK';
  UI.trk = null; UI.sus = null;
  warmUp(1100);
}
function warmUp(steps){
  S.quiet = true;
  for (let i = 0; i < steps; i++){ S.t += 0.2; updateWorld(0.2); ANTAR.tick(S.t); }
  S.quiet = false;
}

const SC = {
  A: { fate: 'A',     name: 'SCENARIO A · NOMINAL',
       note: '[GROUND TRUTH] the vehicle will pass POD B normally.' },
  B: { fate: 'crash', name: 'SCENARIO B · INCIDENT',
       note: '[GROUND TRUTH] the vehicle will stop at K0.610. ANTAR is not told this.' },
  C: { fate: 'exit',  name: 'SCENARIO C · LEGAL EXIT',
       note: '[GROUND TRUTH] the vehicle will turn onto the village road at K0.430. ANTAR is not told this.' }
};

function startScenario(id){
  resetRun();
  S.armed = SC[id].fate;
  S.scenario = id;
  for (const b of document.querySelectorAll('.btn[data-sc]')) b.classList.toggle('on', b.dataset.sc === id);
  logEvt('a', '-- ' + SC[id].name + ' ARMED · awaiting next pass at POD A --');
  logEvt('q', SC[id].note);
  UI.paint();
  $('chk').scrollTop = 0;
}
for (const b of document.querySelectorAll('.btn[data-sc]')){
  b.addEventListener('click', function(){ startScenario(this.dataset.sc); });
}
for (const b of document.querySelectorAll('.btn[data-cam]')){
  b.addEventListener('click', function(){
    setCam(this.dataset.cam);
    for (const o of document.querySelectorAll('.btn[data-cam]'))
      o.classList.toggle('on', o.dataset.cam === this.dataset.cam);
  });
}

/* ================================================================
   BOOT
   ================================================================ */
resize();

/* warm-up: fill the road and establish the rolling POD A/B baselines */
warmUp(1400);
LOGS.length = 0;
logEvt('a', 'ANTAR SIMULATION ONLINE · POD A ' + String.fromCharCode(8646) + ' POD B modelled as paired · ' +
            (CFG.PB - CFG.PA) + ' m segment · simulated uplink to TOWER-07 reachable');
logEvt('', 'Baseline established · every vehicle in the segment tracked in parallel');

let last = performance.now();
function frame(now){
  let dw = (now - last) / 1000;
  last = now;
  if (dw > 0.06) dw = 0.06;
  S.t += dw * CFG.TS;

  updateWorld(dw * CFG.TS);
  ANTAR.tick(S.t);
  TX.update();
  updateCam(dw);
  render();

  if (now - UI.last > 110){ UI.last = now; UI.paint(); }
  requestAnimationFrame(frame);
}
UI.paint();
requestAnimationFrame(frame);

</script>
</body>
